<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto flex max-w-6xl items-center gap-4 px-6 py-3">
    <a routerLink="/tracks" class="flex items-center gap-2 text-lg font-semibold text-slate-900">
      <i class="pi pi-headphones text-emerald-600"></i>
      Takwene
    </a>
    <nav class="ml-4 flex items-center gap-1 text-sm">
      <a
        routerLink="/tracks"
        routerLinkActive="bg-slate-100 text-slate-900"
        class="rounded-md px-3 py-1.5 text-slate-600 hover:bg-slate-50"
      >
        Tracks
      </a>
      @if (auth.isAdmin()) {
        <a
          routerLink="/artists"
          routerLinkActive="bg-slate-100 text-slate-900"
          class="rounded-md px-3 py-1.5 text-slate-600 hover:bg-slate-50"
        >
          Artists
        </a>
      }
    </nav>
    <span class="flex-1"></span>
    <span class="text-sm text-slate-600">{{ auth.email() }}</span>
    <p-tag [value]="auth.isAdmin() ? 'Admin' : 'Artist'" [severity]="auth.isAdmin() ? 'contrast' : 'info'" />
    <p-button label="Logout" icon="pi pi-sign-out" severity="secondary" [text]="true" (onClick)="auth.logout()" />
  </div>
</header>

<main class="mx-auto max-w-6xl px-6 py-6">
  <router-outlet />
</main>
