server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container on the same origin: no CORS, no certificates.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Built files have hashed names, so they can be cached for a long time.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (e.g. /tracks/123) all load index.html, which must never be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
